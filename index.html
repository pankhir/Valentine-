<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Be My Valentine?</title>
    <style>
        body {
            text-align: center;
            font-family: Arial, sans-serif;
            background-color: #ffccd5;
            overflow: hidden;
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }
        h1 {
            font-size: 2.5rem;
            color: #d6336c;
            margin-bottom: 20px;
        }
        #gif-container {
            width: 100%;
            display: none;
        }
        #gif {
            width: 300px;
            border-radius: 10px;
        }
        .btn-container {
            margin-top: 20px;
            position: relative;
            width: 100%;
            height: 100px;
        }
        button {
            font-size: 1.2rem;
            padding: 10px 20px;
            margin: 10px;
            border: none;
            cursor: pointer;
            border-radius: 5px;
            transition: 0.2s ease-in-out;
            position: absolute;
        }
        #yes-btn {
            background-color: #ff4d6d;
            color: white;
            transition: 0.2s ease-in-out;
            left: 50%;
            transform: translateX(-50%);
        }
        #no-btn {
            background-color: #ff8fa3;
            color: white;
        }
    </style>
</head>
<body>
    <h1>Will you be my Valentine? ❤️</h1>
    <div id="gif-container">
        <img id="gif" src="" alt="Response GIF">
    </div>
    <div class="btn-container">
        <button id="yes-btn" onclick="showYesGif()">Yes</button>
        <button id="no-btn" onmouseover="moveButton()">No</button>
    </div>

    <script>
        let yesBtn = document.getElementById("yes-btn");
        let noBtn = document.getElementById("no-btn");
        let gifContainer = document.getElementById("gif-container");
        let gif = document.getElementById("gif");
        let yesSize = 1.2; // Initial size of the "Yes" button

        function showYesGif() {
            gif.src = "https://media1.giphy.com/media/v1.Y2lkPTc5MGI3NjExcWwwajgwYnh4amo1bDh2bDBrbDNtb2NrNm1oeHpyZDA1NTczd2J4YyZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/UkfUod3TFW66J2BWKK/giphy.gif"; // Your "Yes" GIF
            gifContainer.style.display = "block";
        }

        function moveButton() {
            let maxX = window.innerWidth - noBtn.clientWidth - 50;
            let maxY = window.innerHeight - noBtn.clientHeight - 150; // Keeps it within the screen

            let newX = Math.max(50, Math.random() * maxX);
            let newY = Math.max(50, Math.random() * maxY);

            noBtn.style.left = `${newX}px`;
            noBtn.style.top = `${newY}px`;

            gif.src = "https://media.giphy.com/media/H6nsRqHIq6ZRH6K4qJ/giphy.gif"; // Your "No" GIF
            gifContainer.style.display = "block";

            // Increase "Yes" button size
            yesSize += 0.15;
            yesBtn.style.transform = `scale(${yesSize})`;
        }
    </script>
</body>
</html>
